[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boardfarm3-control"
version = "0.1.0"
description = "Boardfarm control plane"
requires-python = ">=3.11"
dependencies = [
    "boardfarm3[api]",
    "httpx[http2]",
    "docker",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["boardfarm3_control"]

[tool.hatch.build.targets.wheel.force-include]
"../boardfarm3_control" = "boardfarm3_control"
